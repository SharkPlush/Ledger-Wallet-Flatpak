app-id: com.ledger.wallet
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
finish-args:
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  
  # USB and Bluetooth needed to talk with the Ledger devices.
  # For some reason 'device=all' needs to be set if it's 'device=usb' then the Ledger device won't be seen at least not over USB-C.
  - --device=all
  - --system-talk-name=org.bluez
  
  # Need network for crypto transfers and stuff like that.
  - --share=network

modules:
  - name: ledger-wallet
    buildsystem: simple
    sources:
      - type: file
        url: https://download.live.ledger.com/latest/linux
        sha256: d2772b61341688524809aa2f37488cb34a451c55223a361c519a2c7ad4b6af86
        dest-filename: ledger-wallet.AppImage

      - type: file
        path: run.sh

      - type: file
        path: com.ledger.wallet.png

      - type: file
        path: com.ledger.wallet.metainfo.xml

      - type: file
        path: com.ledger.wallet.desktop
        
    build-commands:
      - chmod +x ledger-wallet.AppImage
      - ./ledger-wallet.AppImage --appimage-extract
      
      # Remove extras that aren't needed in the Flatpak env and just create a bigger app.      
      - rm squashfs-root/ledger-live-desktop.desktop
      - rm squashfs-root/AppRun
      - rm squashfs-root/ledger-live-desktop.png
      - rm squashfs-root/chrome-sandbox
      - rm -r squashfs-root/usr/share/
      
      - cp -r squashfs-root/* /app/bin/
      - install -Dm755 run.sh /app/bin/run.sh
      - install -Dm444 com.ledger.wallet.png /app/share/icons/hicolor/256x256/apps/com.ledger.wallet.png
      - install -Dm444 com.ledger.wallet.metainfo.xml /app/share/metainfo/com.ledger.wallet.metainfo.xml
      - install -Dm444 com.ledger.wallet.desktop /app/share/applications/com.ledger.wallet.desktop
